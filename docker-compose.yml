services:
  api:
    # Imagen publicada por el workflow. Para desarrollo local:
    # docker compose up --build
    build: .
    image: ghcr.io/rehabhur/rehabhur-api:${IMAGE_TAG:-latest}
    container_name: rehabhur-api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
# 👇 Nuevo servicio de base de datos
  db:
    image: postgres:16-alpine
    container_name: rehabhur-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rehabhur}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rehabhur123}
      POSTGRES_DB: ${POSTGRES_DB:-rehabhur_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"  
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rehabhur} -d ${POSTGRES_DB:-rehabhur_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
